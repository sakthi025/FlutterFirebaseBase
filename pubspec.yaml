name: flutter_firebase_base
description: "FlutterFirebaseBase — Multi-app scaffold with Firebase Auth, Firestore, Storage & Cloud Functions."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase Core ──────────────────────────────────────────────────────────
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5
  cloud_functions: ^5.3.5

  # ── Auth helpers ───────────────────────────────────────────────────────────
  google_sign_in: ^6.2.2

  # ── State Management / DI ─────────────────────────────────────────────────
  provider: ^6.1.4
  get_it: ^8.0.3

  # ── Networking / API Gateway ───────────────────────────────────────────────
  dio: ^5.8.0+1

  # ── Logging & Monitoring ───────────────────────────────────────────────────
  logger: ^2.5.0
  firebase_crashlytics: ^4.3.5
  firebase_performance: ^0.10.1+5

  # ── Local Storage ──────────────────────────────────────────────────────────
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.4

  # ── Navigation ─────────────────────────────────────────────────────────────
  go_router: ^14.8.1

  # ── Utils ──────────────────────────────────────────────────────────────────
  intl: ^0.20.3
  equatable: ^2.0.7
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Testing
  mockito: ^5.4.5
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - config/dev/
    - config/staging/
    - config/prod/
